<div class="admin-layout">
  <div class="d-flex min-vh-100">

    <!-- Backdrop móvil (mismo patrón de binding que el botón existente) -->
    <div
      class="sidebar-backdrop"
      [ngClass]="isSideBarOpen ? 'show' : ''"
      (click)="isSideBarOpen = !isSideBarOpen">
    </div>

    <!-- =========================
         SIDEBAR
    ========================== -->
    <aside class="sidebar" [ngClass]="isSideBarOpen ? ' ' : 'collapsed'">

      <!-- Logo + Toggle -->
      <div class="sidebar-header">

        <div class="sidebar-brand">
          <span class="brand-mark">RR</span>
          <span class="sidebar-title">RRHH</span>
        </div>

        <button
          class="btn btn-link text-white p-0 sidebar-toggle"
          (click)="isSideBarOpen = !isSideBarOpen">

          <i
            class="bi fs-4"
            [ngClass]="isSideBarOpen ? 'bi-chevron-right' : 'bi-chevron-left'">
          </i>

        </button>

      </div>

      <!-- Menú -->
      <nav class="list-group list-group-flush flex-grow-1 sidebar-nav">

        <a
          routerLink="/admin/dashboard"
          class="list-group-item list-group-item-action">

          <i class="bi bi-people-fill"></i>

          <span>Dashboard</span>

        </a>

        <a
          routerLink="/admin/employee-list"
          class="list-group-item list-group-item-action">

          <i class="bi bi-kanban-fill"></i>

          <span>Empleados</span>

        </a>

        <a
          routerLink="/managers"
          routerLinkActive="active"
          class="list-group-item list-group-item-action">

          <i class="bi bi-person-badge-fill"></i>

          <span>Proyectos</span>

        </a>

        <!-- Agregar futuras opciones aquí -->

        <!--
        <a
          routerLink="/departments"
          routerLinkActive="active"
          class="list-group-item list-group-item-action">

          <i class="bi bi-building"></i>

          <span>Departamentos</span>

        </a>
        -->

      </nav>

      <div class="sidebar-footer">
        <span class="sidebar-footer-text">v1.0</span>
      </div>

    </aside>

    <!-- =========================
         CONTENIDO
    ========================== -->

    <div class="flex-grow-1 d-flex flex-column main-panel">

      <!-- Topbar -->
      <nav class="topbar navbar navbar-expand bg-white shadow-sm border-bottom">

        <div class="container-fluid">

          <!-- Toggle móvil -->
          <button
            class="btn btn-link text-primary d-lg-none mobile-toggle"
            (click)="isSideBarOpen= !isSideBarOpen">

            <i class="bi bi-list fs-3"></i>

          </button>

          <div class="ms-auto d-flex align-items-center gap-3">

            <div class="user-chip">
              <span class="user-avatar">
                {{loggedUserData?.employeeName?.charAt(0)}}
              </span>
              <span class="fw-semibold text-primary user-name">
                {{loggedUserData?.employeeName}}
                <!-- ?? -->
              </span>
            </div>

            <button
              class="btn btn-outline-primary rounded-pill px-3 logout-btn"
              (click)="logout()">

              <i class="bi bi-box-arrow-right me-1"></i>
              Cerrar sesión

            </button>

          </div>

        </div>

      </nav>

      <!-- Contenido -->
      <main class="flex-grow-1 p-4 content-area">

        <router-outlet></router-outlet>

        <!-- donde se ubique el router, ahi va el contenido -->

      </main>

    </div>

  </div>
</div>
