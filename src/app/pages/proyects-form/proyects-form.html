

<section class="new-project-section">

    <div class="page-header">
        <h2 class="section-title">Registrar proyecto</h2>
        <p class="section-subtitle">
            Complete la información para registrar un nuevo proyecto.
        </p>
    </div>

    <div class="form-card">

        <form [formGroup]="projectForm">

            <input type="hidden" name="projectId" value="0">

            <p class="form-section-label">Información del proyecto</p>

            <div class="form-grid">

                <div class="form-group">
                    <label>Nombre del proyecto <span class="required">*</span></label>
                    <input type="text" formControlName="projectName" name="projectName" placeholder="Ej. Portal de Autoservicio RRHH" required>
                </div>

                <div class="form-group">
                    <label>Cliente <span class="required">*</span></label>
                    <input type="text" formControlName="clientName" name="clientName" placeholder="Nombre del cliente" required>
                </div>

                <div class="form-group">
                    <label>Fecha de inicio <span class="required">*</span></label>
                    <input type="date" formControlName="startDate" name="startDate" required>
                </div>

                <div class="form-group">
                    <label>Líder del proyecto <span class="required">*</span></label>
                    <select name="leadByEmpId" required formControlName="leadByEmpId">
                        <option selected disabled value="">Seleccione un líder</option>
                        @for(emp of empList(); track emp.employeeId){
                            <option [value]="emp.employeeId">{{emp.employeeName}}</option>
                        }
                        
                    </select>
                    <span class="form-hint">Empleado responsable del proyecto.</span>
                </div>

            </div>

            <p class="form-section-label">Datos de contacto</p>

            <div class="form-grid">

                <div class="form-group">
                    <label>Persona de contacto <span class="required">*</span></label>
                    <input type="text" name="contactPerson" formControlName="contactPerson" placeholder="Nombre de contacto" required>
                </div>

                <div class="form-group">
                    <label>Teléfono de contacto <span class="required">*</span></label>
                    <input type="text" name="contactNo" formControlName="contactNo" placeholder="Número de contacto" required>
                </div>

                <div class="form-group" style="grid-column:1 / -1;">
                    <label>Correo electrónico <span class="required">*</span></label>
                    <input type="email" name="emailId" formControlName="emailId" placeholder="correo@empresa.com" required>
                </div>

            </div>

            <div class="form-actions">
                <button type="button" routerLink="/admin/proyects" class="btn-secondary">
                    Cancelar
                </button>
                <button type="submit" (click)="saveProyect()" class="btn-primary">
                    Registrar proyecto
                </button>
            </div>

        </form>

    </div>

</section>
